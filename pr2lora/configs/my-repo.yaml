# Szablon dla repo w GitHub Enterprise.
# Enterprise: https://github.twoja-firma.com/api/v3
# GitHub.com: https://api.github.com
api_url: https://github.example.com/api/v3
repo: org/crossplane-platform
token_env: GITHUB_TOKEN        # nazwa zmiennej środowiskowej z tokenem
max_prs: 2000                  # 0 = wszystkie; przy setkach tysięcy zacznij od 2000
paths_include: ["apis/", "compositions/", "functions/", "package/", ".yaml"]
max_diff_chars: 24000          # pomijaj zbyt duże PR-y
min_desc_chars: 40             # krótsze opisy -> przepisywane przez LLM (jeśli rewriter.enabled)
rewriter:                      # opcjonalnie, dowolny endpoint zgodny z OpenAI
  enabled: false
  base_url: http://localhost:8000/v1
  model: Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
  api_key_env: REWRITER_API_KEY
base_model: mlx-community/Qwen2.5-Coder-7B-Instruct-4bit
valid_ratio: 0.1
